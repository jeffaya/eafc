name: 👑 Golden Boys Bot
on:
  workflow_dispatch:
    inputs:
      test_webhook:
        description: "Envoyer uniquement un message de test Discord"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "*/10 20-23,0-2 * * *"
      timezone: "Europe/Paris"
permissions:
  contents: write
concurrency:
  group: golden-boys-bot
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test Discord webhook
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_webhook }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node src/test-webhook.js
      - name: Check EA matches
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_webhook) }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node src/index.js
      - name: Persist state
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_webhook) }}
        run: |
          if git diff --quiet -- data/state.json; then exit 0; fi
          git config user.name "golden-boys-bot[bot]"
          git config user.email "golden-boys-bot[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "chore(bot): update processed matches"
          git push
