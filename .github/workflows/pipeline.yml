name: EA FC Clubs Bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: true
        default: "debug-connect"
        type: choice
        options:
          - debug-connect
          - debug-full
          - replay-history
  schedule:
    - cron: "*/10 20-23,0-2 * * *"
    - cron: "55 2 * * *"

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Choose execution mode
        id: choose
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "55 2 * * *" ]]; then
            echo "mode=daily-recap" >> "$GITHUB_OUTPUT"
          else
            echo "mode=normal" >> "$GITHUB_OUTPUT"
          fi

      - name: Run bot
        env:
          DISCORD_CLUB_WEBHOOK_URL: ${{ secrets.DISCORD_CLUB_WEBHOOK_URL }}
          DISCORD_PLAYER_WEBHOOK_URL: ${{ secrets.DISCORD_PLAYER_WEBHOOK_URL }}
          DISCORD_SESSION_WEBHOOK_URL: ${{ secrets.DISCORD_SESSION_WEBHOOK_URL }}
        shell: bash
        run: |
          MODE="${{ steps.choose.outputs.mode }}"
          echo "Mode: $MODE"
          case "$MODE" in
            normal) node src/index.js ;;
            daily-recap) node src/daily-recap.js ;;
            debug-connect) node src/debug-connect.js ;;
            debug-full) node src/debug-full.js ;;
            replay-history) node src/replay-history.js ;;
            *) echo "Unknown mode: $MODE"; exit 1 ;;
          esac

      - name: Commit state
        if: steps.choose.outputs.mode == 'normal'
        shell: bash
        run: |
          if git diff --quiet -- data/state.json; then
            echo "No state change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "chore: update EA FC bot state"
          git push
