name: EA FC Clubs Bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: true
        default: "test-webhook"
        type: choice
        options:
          - test-webhook
          - replay-last-match
          - daily-recap
          - player-recap
          - full-test
          - debug-last-match
          - debug-possession
          - debug-history
          - replay-history
      confirm_history_replay:
        description: "For replay-history only: type YES to publish the historical replay"
        required: false
        default: "NO"
        type: string
  schedule:
    - cron: "*/10 20-23,0-2 * * *"
    - cron: "55 2 * * *"

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Choose execution mode
        id: choose
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "55 2 * * *" ]]; then
            echo "mode=daily-recap" >> "$GITHUB_OUTPUT"
          else
            echo "mode=normal" >> "$GITHUB_OUTPUT"
          fi

      - name: Run bot
        env:
          DISCORD_CLUB_WEBHOOK_URL: ${{ secrets.DISCORD_CLUB_WEBHOOK_URL }}
          DISCORD_PLAYER_WEBHOOK_URL: ${{ secrets.DISCORD_PLAYER_WEBHOOK_URL }}
          CONFIRM_HISTORY_REPLAY: ${{ github.event.inputs.confirm_history_replay || 'NO' }}
        shell: bash
        run: |
          MODE="${{ steps.choose.outputs.mode }}"
          echo "Mode: $MODE"
          case "$MODE" in
            normal) node src/index.js ;;
            test-webhook) node src/test-webhook.js ;;
            replay-last-match) node src/replay-last-match.js ;;
            daily-recap) node src/daily-recap.js ;;
            player-recap) node src/player-recap.js ;;
            full-test) node src/full-test.js ;;
            debug-last-match) node src/debug-last-match.js ;;
            debug-possession) node src/debug-possession.js ;;
            debug-history) node src/debug-history.js ;;
            replay-history) node src/replay-history.js ;;
            *) echo "Unknown mode: $MODE"; exit 1 ;;
          esac

      - name: Commit state
        if: steps.choose.outputs.mode == 'normal'
        shell: bash
        run: |
          if git diff --quiet -- data/state.json; then
            echo "No state change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "chore: update EA FC bot state"
          git push
