name: EA FC Clubs Bot
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: true
        default: "normal"
        type: choice
        options: [normal, debug-connect, debug-full, replay-history]
      replay_date:
        description: "Replay session date (YYYY-MM-DD). Empty = latest available session"
        required: false
        type: string
  schedule:
    - cron: "7-57/10 21-23 * * *"
      timezone: "Europe/Paris"
    - cron: "7-57/10 0-1 * * *"
      timezone: "Europe/Paris"
permissions:
  contents: write
jobs:
  bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Choose execution mode
        id: choose
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=normal" >> "$GITHUB_OUTPUT"
          fi
      - name: Run bot
        env:
          DISCORD_CLUB_WEBHOOK_URL: ${{ secrets.DISCORD_CLUB_WEBHOOK_URL }}
          DISCORD_PLAYER_WEBHOOK_URL: ${{ secrets.DISCORD_PLAYER_WEBHOOK_URL }}
          DISCORD_SESSION_WEBHOOK_URL: ${{ secrets.DISCORD_SESSION_WEBHOOK_URL }}
          REPLAY_DATE: ${{ github.event.inputs.replay_date }}
        shell: bash
        run: |
          case "${{ steps.choose.outputs.mode }}" in
            normal) node src/index.js ;;
            debug-connect) node src/debug-connect.js ;;
            debug-full) node src/debug-full.js ;;
            replay-history) node src/replay-history.js ;;
            *) exit 1 ;;
          esac
      - name: Commit bot data
        if: steps.choose.outputs.mode == 'normal'
        shell: bash
        run: |
          if git diff --quiet -- data/state.json data/history.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/history.json
          git commit -m "chore: update EA FC bot data"
          git push
